<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for long roots - blue -->
    <linearGradient id="longRootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradients for short roots - purple accent -->
    <linearGradient id="shortRootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for medium roots - lighter blue -->
    <linearGradient id="mediumRootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- F₄ Root System centered at (16, 16) -->
  <!-- F₄ has 48 roots: 24 long and 24 short, arranged in a square pattern -->
  <g transform="translate(16, 16)">
    <!-- Primary axes - long roots (4 directions) -->
    <line x1="0" y1="0" x2="11" y2="0" stroke="url(#longRootGrad)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-11" y2="0" stroke="url(#longRootGrad)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="11" stroke="url(#longRootGrad)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-11" stroke="url(#longRootGrad)" stroke-width="1.3" stroke-linecap="round"/>
    
    <!-- Diagonal long roots (4 directions at 45°) -->
    <line x1="0" y1="0" x2="7.78" y2="7.78" stroke="url(#longRootGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-7.78" y2="7.78" stroke="url(#longRootGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="7.78" y2="-7.78" stroke="url(#longRootGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-7.78" y2="-7.78" stroke="url(#longRootGrad)" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Short roots (8 directions) -->
    <!-- Primary axes short -->
    <line x1="0" y1="0" x2="6.5" y2="0" stroke="url(#shortRootGrad)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-6.5" y2="0" stroke="url(#shortRootGrad)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="6.5" stroke="url(#shortRootGrad)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-6.5" stroke="url(#shortRootGrad)" stroke-width="1.1" stroke-linecap="round"/>
    
    <!-- Diagonal short roots at 45° -->
    <line x1="0" y1="0" x2="4.6" y2="4.6" stroke="url(#shortRootGrad)" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4.6" y2="4.6" stroke="url(#shortRootGrad)" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4.6" y2="-4.6" stroke="url(#shortRootGrad)" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4.6" y2="-4.6" stroke="url(#shortRootGrad)" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Central node -->
    <circle cx="0" cy="0" r="1.3" fill="#1e40af"/>
    
    <!-- Endpoint dots for long roots (primary axes) -->
    <circle cx="11" cy="0" r="0.9" fill="#3b82f6"/>
    <circle cx="-11" cy="0" r="0.9" fill="#3b82f6"/>
    <circle cx="0" cy="11" r="0.9" fill="#3b82f6"/>
    <circle cx="0" cy="-11" r="0.9" fill="#3b82f6"/>
    
    <!-- Endpoint dots for long roots (diagonals) -->
    <circle cx="7.78" cy="7.78" r="0.8" fill="#3b82f6"/>
    <circle cx="-7.78" cy="7.78" r="0.8" fill="#3b82f6"/>
    <circle cx="7.78" cy="-7.78" r="0.8" fill="#3b82f6"/>
    <circle cx="-7.78" cy="-7.78" r="0.8" fill="#3b82f6"/>
    
    <!-- Endpoint dots for short roots (primary axes) -->
    <circle cx="6.5" cy="0" r="0.7" fill="#a855f7"/>
    <circle cx="-6.5" cy="0" r="0.7" fill="#a855f7"/>
    <circle cx="0" cy="6.5" r="0.7" fill="#a855f7"/>
    <circle cx="0" cy="-6.5" r="0.7" fill="#a855f7"/>
    
    <!-- Endpoint dots for short roots (diagonals) -->
    <circle cx="4.6" cy="4.6" r="0.6" fill="#a855f7"/>
    <circle cx="-4.6" cy="4.6" r="0.6" fill="#a855f7"/>
    <circle cx="4.6" cy="-4.6" r="0.6" fill="#a855f7"/>
    <circle cx="-4.6" cy="-4.6" r="0.6" fill="#a855f7"/>
  </g>
</svg>